<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元宵节快乐</title>
    <style>
        body {
            background-color: #f0e68c;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 50px;
        }
        .lantern {
            width: 100px;
            height: 150px;
            background-color: #ffcc00;
            position: relative;
            margin: 0 auto 20px;
            border-radius: 50% 50% 0 0;
        }
        .lantern::before {
            content: '';
            width: 120px;
            height: 100px;
            background-color: #ffcc00;
            position: absolute;
            bottom: -50px;
            left: -10px;
            border-radius: 50%;
        }
        .lantern::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: #8b4513;
            position: absolute;
            top: 130px;
            left: 40px;
            border-radius: 50%;
        }
        .rabbit {
            width: 150px;
            height: 150px;
            background-image: url('https://p3-search.byteimg.com/obj/tos-cn-i-qvj2lq49k0/8d3276d94e5d449d8f2fbc094084d020'); 
            background-size: cover;
            margin: 0 auto;
        }
        h1 {
            color: #8b4513;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <div class="lantern"></div> -->
        <div class="rabbit">
        </div>
        <h1>小嘎，祝你元宵节快乐，永远不死，天天没心没肺，吊儿郎当的</h1>
        <h1>元宵节快乐！</h1>
        <p>愿你元宵节快乐，阖家幸福！</p>
    </div>
</body>
</html>
